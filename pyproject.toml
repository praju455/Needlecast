[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = [".", "ml/src"]
testpaths = ["ml/tests", "backend/tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["ml/src", "."]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
