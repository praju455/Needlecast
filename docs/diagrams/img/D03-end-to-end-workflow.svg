<text x="0" y="16.0" fill="#444DA0" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" text-anchor="start">FIGURE D03</text>
<text x="0" y="62.0" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="33" text-anchor="start">Four phases take data from preparation to publication</text>
<text x="0" y="97.0" fill="#516176" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Proposed build and experiment sequence</text>
