<text x="718.495" y="191.0" fill="#516176" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" text-anchor="middle">policy</text>
<text x="15" y="333.0" fill="#516176" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="17" text-anchor="start">Freeze selection before evaluating on the final time period. Publish a run report and artifacts together.</text>
