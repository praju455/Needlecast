services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ARTIFACT_DIR: /app/ml/artifacts/sample
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
    volumes:
      - type: bind
        source: ./ml/artifacts/sample
        target: /app/ml/artifacts/sample
        read_only: true
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 4
