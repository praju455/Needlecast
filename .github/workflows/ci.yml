name: Needlecast checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Run Chromium end-to-end checks
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONPATH: .:ml/src
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements/*.txt
      - run: python -m pip install -r ml/requirements/dev.txt
      - run: |
          python -m ruff check ml
          python -m ruff format --check ml
          python -m mypy ml/src
          make PYTHON=python test-ml
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ml/requirements/*.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r ml/requirements/dev.txt -r backend/requirements.txt
      - run: |
          python -m ruff check backend scripts
          python -m ruff format --check backend scripts
          python -m mypy backend/app
          make PYTHON=python test-backend
          make PYTHON=python types
          git diff --exit-code -- backend/openapi.json frontend/src/lib/types/api.d.ts
      - run: npm exec --yes --package=openapi-typescript@7.10.1 -- openapi-typescript ../backend/openapi.json -o /tmp/needlecast-openapi.d.ts
        working-directory: frontend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run setup:integrations
        working-directory: frontend
      - run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
        working-directory: frontend
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements/base.txt
      - run: python -m pip install -r ml/requirements/base.txt
      - run: |
          make PYTHON=python schemas sample-artifacts validate-artifacts
          git diff --exit-code -- ml/artifacts
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker compose build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npx --yes markdownlint-cli@0.49.1 '*.md' 'docs/**/*.md' 'ml/**/*.md' '.github/**/*.md'
      - run: python3 scripts/check_docs.py

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ml/requirements/base.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r ml/requirements/base.txt -r backend/requirements.txt
      - run: |
          npm ci --legacy-peer-deps
          npm run setup:integrations
          npx playwright install --with-deps chromium
          npm run build
        working-directory: frontend
      - run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          api=$!
          cp -R frontend/.next/static frontend/.next/standalone/frontend/.next/static
          HOSTNAME=127.0.0.1 PORT=3000 node frontend/.next/standalone/frontend/server.js &
          dashboard=$!
          trap 'kill "$api" "$dashboard" 2>/dev/null || true' EXIT
          curl --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ -o /dev/null
          make PYTHON=python api-check
          npm --prefix frontend run smoke
