<text x="93.495" y="205.75" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">Acquire and split</text>
<text x="93.495" y="228.25" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">data</text>
<text x="343.5" y="172.0" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">MODEL</text>
<text x="343.5" y="194.5" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">Fit matched</text>
<text x="343.5" y="217.0" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">baselines and</text>
<text x="343.5" y="239.5" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">quantum candidates</text>
<text x="593.5" y="183.25" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">COMBINE</text>
<text x="593.5" y="205.75" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">Calibrate, route and</text>
<text x="593.5" y="228.25" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">set policy</text>
<text x="843.5" y="183.25" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">SHIP</text>
<text x="843.5" y="205.75" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">Evaluate, validate</text>
<text x="843.5" y="228.25" fill="#18263A" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">and publish artifacts</text>
<text x="218.5" y="191.0" fill="#516176" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" text-anchor="middle">data</text>
